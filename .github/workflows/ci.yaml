name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  lint-commit:
    name: Lint Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR commit messages
        run: |
          # Try to reuse the Conventional Commits pattern from the Husky hook to avoid duplication.
          pattern="$(sed -n 's/^pattern="\([^"]*\)".*/\1/p' .husky/csx/commit-lint.sh 2>/dev/null | head -n 1)"

          # Fallback to the current hardcoded pattern if we couldn't extract it from the Husky script.
          if [ -z "$pattern" ]; then
            pattern="^(feat|fix|build|chore|ci|docs|style|refactor|perf|test)(\(.+\))?!?: .{1,}"
          fi
          failed=0

          while IFS= read -r msg; do
            if echo "$msg" | grep -qE "^(Merge |Revert |Initial commit|fixup! |squash! )"; then
              continue
            fi

            if ! echo "$msg" | grep -qE "$pattern"; then
              encoded_msg="${msg//%/%25}"
              encoded_msg="${encoded_msg//$'\r'/%0D}"
              encoded_msg="${encoded_msg//$'\n'/%0A}"
              echo "::error::Invalid commit message: $encoded_msg"
              failed=1
            fi
          done < <(git log --format='%s' origin/${{ github.base_ref }}..HEAD)

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Expected format: <type>[optional scope]: <description>"
            echo "Valid types: feat, fix, build, chore, ci, docs, style, refactor, perf, test"
            exit 1
          fi

  lint-branch:
    name: Lint Branch Name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        run: |
          branch="${{ github.head_ref }}"
          pattern="^(main|feat|fix|hotfix|release|chore)/.+"

          if echo "$branch" | grep -qE "^(main|master|develop|dev)$"; then
            exit 0
          fi

          if ! echo "$branch" | grep -qE "$pattern"; then
            escaped_branch="${branch//'%'/'%25'}"
            escaped_branch="${escaped_branch//$'\n'/'%0A'}"
            escaped_branch="${escaped_branch//$'\r'/'%0D'}"
            echo "::error::Invalid branch name: $escaped_branch"
            echo ""
            echo "Expected format: <type>/<description>"
            echo "Valid types: main, feat, fix, hotfix, release, chore"
            exit 1
          fi

  lint-format:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test with coverage
        run: dotnet test -c Release --no-build --no-restore

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore tools
        run: dotnet tool restore

      - name: Run mutation testing
        env:
          STRYKER_MUTATING: true
        run: dotnet stryker --since:${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }} --reporter cleartext --reporter html

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: StrykerOutput/**/reports/
          retention-days: 14
