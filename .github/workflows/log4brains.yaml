name: Log4brains ADR Site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build ADR Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install log4brains
        run: npm install -g log4brains@1.1.0

      - name: Build static site
        run: log4brains build --basePath /em2devs-apps-building-management/decisions

      - name: Fix client-side routing for subdirectory deployment
        run: |
          # log4brains uses Next.js 10.2 whose `next export` sets assetPrefix but
          # omits basePath from __NEXT_DATA__, leaving router.basePath empty.
          # This causes runtime data fetches (ADR list, search index) to 404 when
          # the site is served from a subdirectory.  Injecting basePath into
          # __NEXT_DATA__ restores correct client-side routing.
          BASE_PATH="/em2devs-apps-building-management/decisions"
          find .log4brains/out -name '*.html' -exec sed -i \
            "s/\"buildId\":/\"basePath\":\"${BASE_PATH}\",\"buildId\":/g" {} +

      - name: Stage Pages content under /decisions
        run: |
          rm -rf _pages
          mkdir -p _pages/decisions
          cp -R .log4brains/out/. _pages/decisions/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4